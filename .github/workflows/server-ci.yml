name: server-ci

on:
  # No branch filter: pull requests stack here — a client PR based on the platform PR it needs —
  # and a base other than main is the case that most wants a build, not least one. `push` stays
  # pinned to main, because that is the post-merge run.
  pull_request:
    paths:
      - "FeatureFlags.AppHost/**"
      - "FeatureFlags.Domain/**"
      - "FeatureFlags.Domain.Tests/**"
      - "FeatureFlags.Infrastructure/**"
      - "FeatureFlags.Infrastructure.Tests/**"
      - "FeatureFlags.Server/**"
      - "FeatureFlags.Server.Tests/**"
      - "FeatureFlags.slnx"
      - "shared/**"
      - "Directory.Build.props"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [main]
    paths:
      - "FeatureFlags.AppHost/**"
      - "FeatureFlags.Domain/**"
      - "FeatureFlags.Domain.Tests/**"
      - "FeatureFlags.Infrastructure/**"
      - "FeatureFlags.Infrastructure.Tests/**"
      - "FeatureFlags.Server/**"
      - "FeatureFlags.Server.Tests/**"
      - "FeatureFlags.slnx"
      - "shared/**"
      - "Directory.Build.props"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/server-ci.yml"

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FeatureFlags.slnx

      - name: Build
        run: dotnet build FeatureFlags.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution FeatureFlags.slnx --no-build --no-restore --configuration Release
