# Builds the images from this working tree instead of pulling published ones.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# For working on FutureFlags itself, or for trying a change before it is released. Ordinary
# self-hosting does not need this file — and note that the everyday development loop is
# `aspire run`, not this: compose has no file watching and no hot reload.

services:
  server:
    build:
      context: ../..
      dockerfile: FutureFlags.Server/Dockerfile
    image: futureflags-server:local

  auth:
    build:
      context: ../../auth
    image: futureflags-auth:local
