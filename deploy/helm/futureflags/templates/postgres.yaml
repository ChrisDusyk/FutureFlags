{{- if .Values.postgres.bundled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "futureflags.fullname" . }}-postgres
  labels:
    {{- include "futureflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "futureflags.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "futureflags.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "futureflags.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: futureflags
            - name: POSTGRES_DB
              value: futureflagsdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Always the chart's own Secret: the connection URL is composed from this
                  # password at template time, so it cannot come from somewhere the chart
                  # cannot read. An operator who wants to own that Secret wants postgres.external.
                  name: {{ include "futureflags.chartSecretName" . }}
                  key: POSTGRES_PASSWORD
            # The image initialises the cluster in a subdirectory so that a volume with a
            # lost+found in it — which is most of them — is not mistaken for a broken data dir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "futureflags", "-d", "futureflagsdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "futureflags", "-d", "futureflagsdb"]
            initialDelaySeconds: 20
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "futureflags.fullname" . }}-postgres
  labels:
    {{- include "futureflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "futureflags.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
