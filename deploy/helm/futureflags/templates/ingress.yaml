{{- if .Values.ingress.enabled }}
{{- $host := include "futureflags.host" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "futureflags.fullname" . }}
  labels:
    {{- include "futureflags.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          # One rule, everything to the server. /api/auth is not routed to the auth service here:
          # the server forwards it internally, which is what keeps the console on a single origin
          # and its session cookie first-party. Splitting that path at the ingress would undo it.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "futureflags.fullname" . }}-server
                port:
                  name: http
{{- end }}
