# The origin a browser will load the console on, scheme included.
#
# The single most important value here. It decides the ingress host, the origin the auth service
# trusts, and the URL Better Auth builds links against — and those have to agree. A mismatch does
# not fail at startup; it fails at somebody's first sign-in, with an error that does not name the
# cause. Include the port if it is not the scheme's default.
#
# The ingress host is derived from this by dropping the scheme, the port, and any path, because an
# Ingress host is a DNS name and nothing else. The auth service still receives the whole origin,
# port included, since that is what a browser actually sends.
origin: https://flags.example.com

# Origins of your own web applications that read flags from a browser.
#
# Empty by default, and leave it that way unless you have one: an installation whose flags are only
# read by server-side code should not be answering a cross-origin request at all. These are whole
# origins — scheme, host, and port if it is not the default — because that is what a browser puts
# in an Origin header, and anything else can never match one. The chart refuses a value carrying a
# path, and so does the server at startup.
#
# This decides who may *read* the answer. What a browser must *present* is a publishable key
# (ffp_), issued in the console under Organization → Environments; a secret key is refused from a
# browser no matter which origin it came from.
browserOrigins: []
  # - https://app.example.com

image:
  registry: ghcr.io
  repository: chrisdusyk
  # Defaults to the chart's appVersion. Set this only to pin something else deliberately.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

auth:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Signs sessions and the ES256 tokens the API validates.
#
# Leave `secret` empty and set `existingSecret` to the name of a Secret holding a
# BETTER_AUTH_SECRET key — putting a real secret in a values file means committing it. Generate
# one with `openssl rand -base64 32`; changing it later signs everybody out.
betterAuth:
  secret: ""
  existingSecret: ""

migrations:
  # auto | job | off
  #
  # `job` is the default because a chart is the deployment shape most likely to run more than one
  # replica, and in-process migration on startup is only safe at exactly one. The job runs the
  # auth service's migration first and the server's second — the server's puts a trigger on
  # auth."user", so that order is a requirement rather than a preference.
  #
  # `auto` migrates in the server process instead, gated behind a Postgres advisory lock, and adds
  # an init container that waits for the auth service to be ready. Reasonable for a single-replica
  # install that would rather not think about it.
  #
  # `off` leaves migrating entirely to whoever operates the database.
  mode: job

postgres:
  # The bundled database is a single StatefulSet with no backups, no failover, and no connection
  # pooling. It is here so `helm install` works on its own, which is worth something for a trial —
  # but anything you would miss should point `external.url` at a database somebody maintains.
  bundled: true
  image: postgres:17-alpine
  storage: 8Gi
  storageClassName: ""
  # Only used when bundled. Generate a URL-safe one — `openssl rand -hex 24`, not base64: this
  # goes into a postgres:// URL, and a '/' in it would end the authority early. The chart
  # percent-encodes it, so an awkward password does work here — but the same one written into
  # `external.url` or the compose bundle by hand is not escaped for you.
  #
  # There is no `existingSecret` for the bundled database on purpose. The connection URL is
  # composed from this password while templating, so it cannot come from a Secret the chart
  # cannot read — if you want to own that Secret, you want `external` below.
  password: ""
  external:
    # postgres://user:password@host:5432/futureflagsdb
    url: ""
    existingSecret: ""

redis:
  bundled: true
  image: redis:7-alpine
  external:
    url: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    # Leave empty to let the ingress controller name the secret, or point at one you manage.
    secretName: ""

# Applied to both deployments.
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
